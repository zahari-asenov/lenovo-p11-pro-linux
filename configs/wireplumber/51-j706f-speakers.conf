# Match the stock Android PCM stream format as well as the hardware backend.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.platform-sound.stereo-fallback" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
      }
    }
  }
]
